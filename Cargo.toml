[package]
name = "ecom"
version = "0.1.0"
edition = "2021"
authors = ["Ejiroghene Douglas Dominic"]
description = "A hybrid RBAC-ABAC access control system with JWT authentication and Actix Web integration"
license = "MIT OR Apache-2.0"
repository = ""
keywords = ["rbac", "abac", "authorization", "authentication", "access-control", "security", "jwt"]
categories = ["authentication", "web-programming"]

[dependencies]
# Web framework
actix-web = "4.4"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
env_logger = "0.10"
log = "0.4"

# UUID generation (for session IDs, user IDs, etc.)
uuid = { version = "1.6", features = ["v4", "serde"] }

# Authentication and security
bcrypt = "0.15"                    # Password hashing
jsonwebtoken = "9.1"               # JWT tokens

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Optional: For more advanced features
# For database support (uncomment when needed)
# sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
# diesel = { version = "2.1", features = ["postgres", "chrono", "uuid"] }

# For configuration management (uncomment when needed)
# config = "0.13"
# dotenv = "0.15"

# For rate limiting (uncomment when needed)
# governor = "0.6"

# For caching (uncomment when needed)
# redis = "0.24"

# For metrics and monitoring (uncomment when needed)
# prometheus = "0.13"
# tracing = "0.1"
# tracing-subscriber = "0.3"

# For email sending (uncomment when needed)
# lettre = "0.11"
# lettre_email = "0.9"

# For input validation (uncomment when needed)
# validator = { version = "0.16", features = ["derive"] }

# For CORS support (uncomment when needed)
# actix-cors = "0.6"

[dev-dependencies]
# Testing utilities
actix-rt = "2.9"
actix-test = "0.1"
tokio-test = "0.4"

[features]
default = []

# Database features (uncomment when needed)
# postgres = ["sqlx/postgres"]
# mysql = ["sqlx/mysql"]
# sqlite = ["sqlx/sqlite"]

# Monitoring features
# metrics = ["prometheus"]
# tracing = ["tracing", "tracing-subscriber"]

# Performance features
# redis-cache = ["redis"]
# rate-limiting = ["governor"]

# Email features
# email = ["lettre", "lettre_email"]

# Validation features
# validation = ["validator"]

# CORS features
# cors = ["actix-cors"]

[[bin]]
name = "server"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = 'unpacked'
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = 'packed'
debug-assertions = false
overflow-checks = false
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false

[profile.test]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]